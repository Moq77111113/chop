name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Download deps
        run: go mod download

      - name: Verify deps
        run: go mod verify

      - name: Format check
        run: |
          gofmt -s -l . > fmt.out
          if [ -s fmt.out ]; then
            cat fmt.out
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"

      - name: Install ffmpeg + jq
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq

      - name: Generate fixture
        run: make fixture

      - name: Build
        run: make build

      - name: Smoke
        run: ./scripts/smoke.sh
