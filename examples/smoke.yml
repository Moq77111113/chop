name: smoke
description: One source replays a pattern. One link proxies it with adjustable loss.

blocks:
    - id: cam-1
      type: source
      config:
          file: testdata/pattern.h264
          listen: 127.0.0.1:6710
          fps: 30

    - id: link-1
      type: link
      config:
          upstream: rtsp://127.0.0.1:6710/cam1
          serve_at: 127.0.0.1:6720
      controls:
          loss: 0.0
          latency_ms: 0
          jitter_ms: 0
          bandwidth_kbps: 0
